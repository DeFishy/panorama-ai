[project]
name = "panorama-web"
version = "0.1.0"
description = "Сайт и API карточек Panorama AI"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "jsonschema>=4.23",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx2>=2.16",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panorama_web"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# Тесты лежат в tests/web, вне пакета, поэтому подсказываем ruff, что пакет свой.
known-first-party = ["panorama_web"]
